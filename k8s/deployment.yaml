apiVersion: v1
kind: Namespace
metadata:
  name: redis-performance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cluster-app
  namespace: redis-performance
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-cluster-app
  template:
    metadata:
      labels:
        app: redis-cluster-app
    spec:
      containers:
        - name: app
          image: redis-cluster-app:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATA_REDIS_CLUSTER_NODES
              value: redis-cluster.redis.svc.cluster.local:6379
            - name: LOG_PATH
              value: /app/logs
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/redis/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/redis/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-app
  namespace: redis-performance
spec:
  selector:
    app: redis-cluster-app
  ports:
    - name: http
      port: 8080
      targetPort: http
